[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-ru-messengers"
version = "0.1.0"
description = "Hermes Agent plugins for Russian messengers (MAX, VK) — RF whitelist-friendly channels"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hermes RU Community" }]
keywords = ["hermes-agent", "telegram-alternative", "vk", "max-messenger", "russia"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
vk = ["vkbottle>=4.6"]
all = ["vkbottle>=4.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-mock>=3"]
webhook = ["uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
